# A version tag (v0.1.0): test, build the installer with that version, and publish it as a GitHub Release.
# 0.x versions and versions with a suffix (v1.0.0-rc1) are marked as pre-releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # WinFsp with its Developer part: the build references its .NET API (bin\winfsp-msil.dll), which a default
      # install (choco's too) leaves out. The same version as the developers' PCs; the smoke test mounts with it.
      # The installer is cached so a GitHub release-download hiccup (504s happen) doesn't fail the run; a cache miss retries.
      - name: Cache the WinFsp installer
        uses: actions/cache@v4
        with:
          path: winfsp.msi
          key: winfsp-2.1.25156

      - name: Install WinFsp
        shell: pwsh
        run: |
          if (-not (Test-Path winfsp.msi)) {
            Invoke-WebRequest https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi -OutFile winfsp.msi -MaximumRetryCount 5 -RetryIntervalSec 15
          }
          Start-Process msiexec.exe -ArgumentList '/i', 'winfsp.msi', '/qn', 'ADDLOCAL=F.Main,F.User,F.Developer' -Wait
          if (-not (Test-Path "${env:ProgramFiles(x86)}\WinFsp\bin\winfsp-msil.dll")) { throw "WinFsp's .NET API (winfsp-msil.dll) was not installed" }

      - name: Test
        run: dotnet test --solution OrthoStreamXP.slnx -c Release

      - name: Build the installer
        shell: pwsh
        run: .\build-installer.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))

      # The user guide PDF is built locally (build-user-guide.ps1) and committed with the docs.
      - name: Add the user guide
        shell: pwsh
        run: Copy-Item docs\OrthoStreamXP-UserGuide.pdf artifacts\releases

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $flags = @('--title', "OrthoStreamXP $version", '--generate-notes')
          if ($version.StartsWith('0.') -or $version.Contains('-')) { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' (Get-ChildItem artifacts\releases -File).FullName @flags
